name: Build HesabGara Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract HesabGara mobile project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 2 -type f -name 'HesabGara*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          APP_DIR="$(find extracted -type f -name package.json -path '*/mobile/android-app/*' -print -quit | xargs -r dirname)"
          test -n "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Mobile project: $APP_DIR"

      - name: Install Capacitor dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Prepare HesabGara.apk
        shell: bash
        run: |
          mkdir -p output
          cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" output/HesabGara.apk
          ls -lh output/HesabGara.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabGara-apk
          path: output/HesabGara.apk
          if-no-files-found: error
          retention-days: 30
