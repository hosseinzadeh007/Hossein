name: Build Android APK

on:
  workflow_dispatch:   # دکمه‌ی «Run workflow» در تب Actions

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons from the logo
        run: npm run icons

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android-app/android
        run: ./gradlew assembleDebug

      - name: Show SHA256 (to verify the download)
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HesabGara-apk
          path: mobile/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
