name: Build HesabGara Android APK

on:
  workflow_dispatch:   # دکمه‌ی «Run workflow» در تب Actions

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/android-app   # پوشه‌ی پروژه‌ی اندروید در مخزن
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17        # Capacitor 6 به Java 17 نیاز دارد

      # Android SDK روی ماشین‌های GitHub از قبل نصب است (API 34/35 و build-tools)؛
      # بنابراین مرحله‌ی setup-android لازم نیست. این مرحله فقط برای عیب‌یابی است.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons from the logo
        run: npm run icons

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android-app/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: SHA256 of the APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HesabGara-apk
          path: mobile/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
