name: Build HesabGara Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract HesabGara mobile project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 2 -type f -name 'HesabGara*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: HesabGara ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          APP_DIR="$(find extracted -type f \
            -name package.json \
            -path '*/mobile/android-app/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Mobile project not found."
            echo "Expected path: mobile/android-app"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Mobile project found:"
          echo "$APP_DIR"

      - name: Install Capacitor dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare HesabGara.apk
        shell: bash
        run: |
          mkdir -p output

          APK="$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" output/HesabGara.apk

          echo "================================"
          echo "HesabGara APK successfully built"
          echo "================================"

          ls -lh output/HesabGara.apk

      - name: Upload HesabGara APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabGara-Android
          path: output/HesabGara.apk
          if-no-files-found: error
