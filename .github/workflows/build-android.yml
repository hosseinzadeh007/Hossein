name: Build HesabGara Android APK

# ورودی‌ها در ریشه‌ی مخزن:
#   hesabgara-app.html   (صفحه‌ی اپ موبایل؛ اگر نبود از داخل زیپ پروژه در مخزن برداشته می‌شود)
#   hesabgara-icon.png   (آیکون؛ اختیاری)
# پروژه‌ی اندروید در خود اجرا ساخته می‌شود.

on:
  workflow_dispatch:   # دکمه‌ی «Run workflow» در تب Actions

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Prepare input files
        run: |
          # اگر hesabgara-app.html در ریشه نیست، از داخل زیپ پروژه (اگر در مخزن هست) برداشته می‌شود.
          if [ ! -f hesabgara-app.html ]; then
            for z in ./*.zip; do
              [ -f "$z" ] || continue
              for p in mobile/hesabgara-mobile.html mobile/android-app/www/index.html; do
                if unzip -l "$z" "$p" > /dev/null 2>&1; then
                  unzip -p "$z" "$p" > hesabgara-app.html
                  echo "صفحه‌ی اپ از «$z» ($p) برداشته شد"
                  break 2
                fi
              done
            done
          fi
          test -s hesabgara-app.html || { echo "فایل hesabgara-app.html پیدا نشد و داخل زیپ‌های مخزن هم نبود"; ls -la; exit 1; }
          ls -la hesabgara-app.html hesabgara-icon.png 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17        # Capacitor 6 به Java 17 نیاز دارد

      # Android SDK روی ماشین‌های GitHub از قبل نصب است؛ مرحله‌ی جداگانه لازم نیست.
      - name: Create Capacitor project
        run: |
          mkdir -p app/www app/assets
          cp hesabgara-app.html app/www/index.html
          if [ -f hesabgara-icon.png ]; then cp hesabgara-icon.png app/assets/icon-only.png; fi
          cd app
          cat > package.json <<'JSON'
          {
            "name": "hesabgara-mobile",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.0",
              "@capacitor/cli": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ir.hesabgara.mobile",
            "appName": "HesabGara",
            "webDir": "www",
            "backgroundColor": "#04185b"
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor "#04185b"
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: SHA256 of the APK
        run: sha256sum app/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HesabGara-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
