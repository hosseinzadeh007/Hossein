<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب‌گرا موبایل</title>
<meta name="theme-color" content="#04185b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حساب‌گرا">
<link rel="icon" type="image/png">
<link rel="apple-touch-icon">
<link rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0d1b3d;--mut:#5a6885;--line:#dbe3f1;--ok:#0f8a5f;--okBg:#e1f5ec;--warn:#a8650a;--warnBg:#fbf0dc;--bad:#c0331f;--badBg:#fce8e4;--acc:#04185b;--acc2:#0f5fd6;--link:#0a3d99;--sh:0 1px 2px rgba(4,24,91,.06),0 8px 20px rgba(4,24,91,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1f;--card:#0f1830;--ink:#e7edfb;--mut:#93a2c4;--line:#1c2a4a;--ok:#4fcfa6;--okBg:#10362b;--warn:#e6a844;--warnBg:#3a2c10;--bad:#f28a78;--badBg:#3c1a14;--acc:#06215f;--acc2:#2b6ff0;--link:#7db2ff;--sh:0 1px 2px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#070d1f;--card:#0f1830;--ink:#e7edfb;--mut:#93a2c4;--line:#1c2a4a;--ok:#4fcfa6;--okBg:#10362b;--warn:#e6a844;--warnBg:#3a2c10;--bad:#f28a78;--badBg:#3c1a14;--acc:#06215f;--acc2:#2b6ff0;--link:#7db2ff;--sh:0 1px 2px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:640px;margin:0 auto;padding:14px 16px 96px}
h1{font-size:22px;font-weight:800;margin:6px 0 2px;letter-spacing:-.2px}h2{font-size:15px;font-weight:600;margin:0 0 8px}.mut{color:var(--mut);font-size:13px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);pointer-events:none}
.hero.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero .big{font-size:30px;font-weight:800;line-height:1.3;letter-spacing:-.5px}.hero .mut{color:rgba(255,255,255,.8)}
.ring{width:76px;height:76px;flex:none}.hero .mut{font-size:12.5px}
.bar{height:7px;border-radius:4px;background:rgba(127,127,127,.25);overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}.hero .bar i{background:#8ec5ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--x,var(--line))}.stat b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.stat.bad{--x:var(--bad)}.stat.warn{--x:var(--warn)}.stat.ok{--x:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.bl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;background:none;border:0;padding:6px 0;color:inherit;font:inherit;text-align:right;cursor:pointer}.bl i{grid-column:1/-1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc2) var(--w),var(--line) var(--w))}
.row{position:relative;background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;display:block;width:100%;text-align:right;color:inherit;font:inherit;cursor:pointer;border:0;box-shadow:var(--sh);overflow:hidden;transition:transform .12s}.row::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--x,var(--line))}
.row:active{transform:scale(.985)}.row.s-ok{--x:var(--ok)}.row.s-warn{--x:var(--warn)}.row.s-bad{--x:var(--bad)}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.row .top b{font-weight:600}
.tag{font-size:12px;font-weight:600;border-radius:10px;padding:1px 10px;white-space:nowrap}.tag.ok{color:var(--ok);background:var(--okBg)}.tag.warn{color:var(--warn);background:var(--warnBg)}.tag.bad{color:var(--bad);background:var(--badBg)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
input[type=search]{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:10px 0;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chip{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:6px 15px;font:inherit;cursor:pointer;box-shadow:var(--sh)}.chip[aria-pressed=true]{background:var(--acc2);color:#fff}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(15,58,49,.06)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);padding:9px 4px 8px;font:inherit;font-size:12px;cursor:pointer}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=true]{color:var(--link);font-weight:600}nav button[aria-current=true]::before{content:"";width:28px;height:3px;border-radius:2px;background:var(--link);margin-bottom:3px}
.btn{display:inline-block;background:var(--acc2);color:#fff;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}.btn.alt{background:none;color:var(--bad);border:1px solid var(--line)}
#sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 30px;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility .28s}
#sheet.on{transform:none;visibility:visible}#sheet .inner{max-width:640px;margin:0 auto}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}dt{color:var(--mut)}dd{margin:0}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}.empty svg{width:120px;height:auto;margin-bottom:6px}
@keyframes up{from{opacity:0;transform:translateY(8px)}}.hero,.stat,.card,.row{animation:up .35s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--link);outline-offset:2px}
#hdr{position:sticky;top:0;z-index:5;background:var(--card);box-shadow:var(--sh);padding:9px 16px}
#hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
#hdr img{width:42px;height:42px;border-radius:11px;flex:none;box-shadow:0 2px 8px rgba(4,24,91,.3)}
#hdr b{display:block;font-size:17px;font-weight:800;color:var(--link);line-height:1.25}#hdr small{color:var(--mut);font-size:11.5px;letter-spacing:.3px}
#hdr .sync{margin-inline-start:auto;font-size:11.5px;color:var(--mut);text-align:start;line-height:1.5}
.hero>*{position:relative;z-index:1}.hero .motif{position:absolute;inset-inline-start:6px;bottom:0;width:150px;opacity:.11;z-index:0;pointer-events:none}
.empty h1{color:var(--ink);font-size:20px;margin:6px 0 4px}.empty-logo{width:104px;height:104px;border-radius:26px;box-shadow:0 10px 28px rgba(4,24,91,.35);margin-bottom:10px}
</style>
</head>

<main id="app"></main>

  const cl=$('#clear');if(cl)cl.onclick=()=>{if(confirm('اطلاعات ذخیره‌شده روی این گوشی پاک شود؟')){try{localStorage.removeItem(KEY)}catch(e){}D=null;render()}};
}
function vSum(app){
  const t=totals(D.invoices),over=D.invoices.filter(i=>i.st==='over'),pend=checks().filter(c=>c.checkStatus==='در انتظار وصول'),ret=checks().filter(c=>c.checkStatus==='برگشتی');
  app.innerHTML=`<h1>خلاصه‌ی وضعیت</h1>
  <section class="hero split"><svg class="motif" viewBox="0 0 120 70" aria-hidden="true"><g fill="#fff"><rect x="8" y="42" width="16" height="28" rx="3"/><rect x="34" y="30" width="16" height="40" rx="3"/><rect x="60" y="18" width="16" height="52" rx="3"/><rect x="86" y="6" width="16" height="64" rx="3"/></g><path d="M6 34L44 22L70 12L112 2" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg><div><div class="mut">مانده کل (ریال)</div><div class="big">${fmt(t.b)}</div><div class="mut">${fmt(t.p)} از ${fmt(t.a)} وصول شده</div></div>${ring(t.pct)}</section>
  <div class="grid"><div class="stat"><span class="mut">فاکتور</span><b>${fmt(D.invoices.length)}</b></div><div class="stat"><span class="mut">شرکت</span><b>${fmt(D.companies.length)}</b></div>
  <div class="stat ${over.length?'bad':''}"><span class="mut">سررسید گذشته</span><b>${fmt(over.length)}</b><span class="mut">${fmt(over.reduce((s,i)=>s+i.bal,0))}</span></div>
  <div class="stat ${pend.length?'warn':''}"><span class="mut">چک در انتظار</span><b>${fmt(pend.length)}</b><span class="mut">${fmt(pend.reduce((s,c)=>s+c.amount,0))}</span></div>
  <div class="stat ${ret.length?'bad':''}"><span class="mut">چک برگشتی</span><b>${fmt(ret.length)}</b></div><div class="stat ok"><span class="mut">وصول‌ها</span><b>${fmt(D.payments.length)}</b></div></div>
  ${topCo()}
  <p><button class="btn" id="cloud">دریافت از ابر</button> <button class="btn alt" id="pick" style="color:var(--link)">فایل جدید</button> <button class="btn alt" id="clear">پاک کردن</button></p>
  <p class="mut">اطلاعات فقط روی همین گوشی ذخیره می‌شود و برای هیچ سرویسی ارسال نمی‌شود. برنامه فقط‌خواندنی است؛ ثبت و ویرایش در حساب‌گرا ویندوز انجام می‌شود.</p>`;
}
function invRow(i){const[l,c]=ST[i.st],pct=i.amount?Math.min(100,Math.round(i.paid/i.amount*100)):0;
  return`<button class="row s-${c}" data-inv="${i.id}"><div class="top"><b>${esc(i.co)}</b><span class="tag ${c}">${l}</span></div><div class="mut">فاکتور ${esc(i.number)} · سررسید ${esc(i.dueFa)}</div><div class="top"><span>مانده ${fmt(i.bal)}</span><span class="mut">از ${fmt(i.amount)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></button>`}
function chips(items){return`<div class="chips">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${flt===k}">${l}</button>`).join('')}</div>`}
function vInv(app){
  const t=q.trim().toLowerCase();
  const list=D.invoices.filter(i=>(flt==='all'||i.st===flt)&&(!t||(i.number+' '+i.co+' '+(i.note||'')).toLowerCase().includes(t))).sort((a,b)=>a.due<b.due?-1:1);
  app.innerHTML=`<h1>فاکتورها</h1><input id="q" type="search" placeholder="جستجو: شماره فاکتور یا نام شرکت" value="${esc(q)}">${chips([['all','همه'],['open','باز'],['over','سررسید گذشته'],['paid','تسویه']])}<div class="mut">${fmt(list.length)} فاکتور · مانده ${fmt(list.reduce((s,i)=>s+i.bal,0))}</div>${list.map(invRow).join('')||'<div class="empty">موردی پیدا نشد.</div>'}`;
}
function vCo(app){
  const t=q.trim().toLowerCase();
  const rows=D.companies.map(c=>({c,l:D.invoices.filter(i=>i.companyId===c.id)})).map(x=>({...x,t:totals(x.l)})).filter(x=>!t||x.c.name.toLowerCase().includes(t)).sort((a,b)=>b.t.b-a.t.b);
  app.innerHTML=`<h1>شرکت‌ها</h1><input id="q" type="search" placeholder="جستجوی نام شرکت" value="${esc(q)}">${rows.map(x=>`<button class="row" data-co="${x.c.id}"><div class="top"><b>${esc(x.c.name)}</b><span>${fmt(x.t.b)}</span></div><div class="mut">${fmt(x.l.length)} فاکتور · وصول‌شده ${x.t.pct.toLocaleString('fa-IR')}٪</div><div class="bar"><i style="width:${x.t.pct}%"></i></div></button>`).join('')||'<div class="empty">موردی پیدا نشد.</div>'}`;
}
function vChk(app){
  const t=q.trim().toLowerCase(),order={'برگشتی':0,'در انتظار وصول':1};
  const list=checks().filter(c=>(flt==='all'||c.checkStatus===flt)&&(!t||(c.checkNumber+' '+c.co+' '+c.num).toLowerCase().includes(t))).sort((a,b)=>(order[a.checkStatus]??2)-(order[b.checkStatus]??2));
  const cl={'برگشتی':'bad','در انتظار وصول':'warn'};
  app.innerHTML=`<h1>چک‌ها</h1><input id="q" type="search" placeholder="شماره چک یا نام شرکت" value="${esc(q)}">${chips([['all','همه'],['در انتظار وصول','در انتظار'],['برگشتی','برگشتی'],['وصول‌شده','وصول‌شده']])}${list.map(c=>`<button class="row s-${cl[c.checkStatus]||'ok'}" data-inv="${c.invoiceId}"><div class="top"><b>${esc(c.co)}</b><span class="tag ${cl[c.checkStatus]||'ok'}">${esc(c.checkStatus||'—')}</span></div><div class="mut">چک ${esc(c.checkNumber||'بدون شماره')} · تاریخ چک ${esc(c.checkDateFa||'—')} · فاکتور ${esc(c.num)}</div><div>${fmt(c.amount)} ریال</div></button>`).join('')||'<div class="empty">موردی پیدا نشد.</div>'}`;
}
function sheet(html){const s=$('#sheet');s.innerHTML=`<div class="inner"><p><button class="btn" id="back">بازگشت</button></p>${html}</div>`;s.classList.add('on');$('#back').onclick=closeSheet;s.scrollTop=0;s.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>openInv(+b.dataset.inv))}
function closeSheet(){$('#sheet').classList.remove('on')}
function openInv(id){
  const i=D.invoices.find(v=>v.id===id);if(!i)return;const[l,c]=ST[i.st],pays=(M.p[id]||[]).slice().reverse();
  sheet(`<h1>فاکتور ${esc(i.number)}</h1><span class="tag ${c}">${l}</span><dl><dt>شرکت</dt><dd>${esc(i.co)}</dd><dt>تاریخ</dt><dd>${esc(i.dateFa)}</dd><dt>سررسید</dt><dd>${esc(i.dueFa)}</dd><dt>مبلغ</dt><dd>${fmt(i.amount)}</dd><dt>پرداختی</dt><dd>${fmt(i.paid)}</dd><dt>مانده</dt><dd><b>${fmt(i.bal)}</b></dd>${i.note?`<dt>یادداشت</dt><dd>${esc(i.note)}</dd>`:''}</dl>
  <h1>وصول‌ها (${fmt(pays.length)})</h1>${pays.map(p=>`<div class="row"><div class="top"><b>${fmt(p.amount)}</b><span class="mut">${esc(p.dateFa)}</span></div><div class="mut">${esc(p.method)}${p.method==='چک'?` · چک ${esc(p.checkNumber||'—')} · ${esc(p.checkDateFa||'—')} · ${esc(p.checkStatus||'')}`:''}${p.note?` · ${esc(p.note)}`:''}</div></div>`).join('')||'<div class="empty">وصولی ثبت نشده است.</div>'}`);
}
function openCo(id){
  const c=M.c[id],l=D.invoices.filter(i=>i.companyId===id),t=totals(l);
  sheet(`<h1>${esc(c.name)}</h1><div class="mut">${esc(c.phone||'')} ${c.nationalId?'· شناسه ملی '+esc(c.nationalId):''}</div><section class="hero"><div class="mut">مانده (ریال)</div><div class="big">${fmt(t.b)}</div><div class="bar"><i style="width:${t.pct}%"></i></div><div class="mut">${fmt(t.p)} از ${fmt(t.a)}</div></section>${l.sort((a,b)=>a.due<b.due?-1:1).map(invRow).join('')}`);
}
function accept(d){
  if(!d||d.app!=='HesabGara'||!Array.isArray(d.invoices)||!Array.isArray(d.companies)||!Array.isArray(d.payments))throw new Error('format');
  D=d;index();try{localStorage.setItem(KEY,JSON.stringify(d))}catch(err){alert('اطلاعات وارد شد ولی ذخیره‌ی دائمی روی این مرورگر ممکن نشد؛ با بستن صفحه از بین می‌رود.')}
  closeSheet();tab='sum';render();
}
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{accept(JSON.parse(await f.text()))}
  catch(err){alert('این فایل، خروجی موبایل حساب‌گرا نیست. از تنظیمات حساب‌گرا ویندوز «ساخت فایل برای موبایل» را بزنید.')}
};
// ---- دریافت ابری: رمزگشایی کاملاً روی همین گوشی انجام می‌شود ----
const CK='hesabgara.cloud.v1';
let CL=null;try{CL=JSON.parse(localStorage.getItem(CK)||'null')}catch(e){CL=null}
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function parsePair(code){
  try{
    const t=(code||'').trim();if(!t.startsWith('HG1.'))return null;
    let b=t.slice(4).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const o=JSON.parse(new TextDecoder().decode(fromB64(b)));
    return(/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$))[^\s]*/.test(o.u)&&/^[0-9a-f]{32}$/.test(o.i))?{u:o.u.replace(/\/+$/,''),i:o.i}:null;
  }catch(e){return null}
}
async function decryptEnvelope(text,password){
  const e=JSON.parse(text);
  if(e.v!==1||e.kdf!=='pbkdf2-sha256'||!(e.iter>=100000&&e.iter<=2000000))throw new Error('format');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(e.iv)},key,fromB64(e.ct)));
}
async function pullCloud(code,password){
  const p=parsePair(code);if(!p)throw new Error('کد اتصال معتبر نیست.');
  if(!password)throw new Error('رمز را وارد کنید.');
  let r;try{r=await fetch(p.u+'/v1/blob/'+p.i,{cache:'no-store'})}catch(e){throw new Error('اتصال برقرار نشد. اینترنت را بررسی کنید (این نسخه باید از اپ نصبی یا آدرس خودتان باز شده باشد).')}
  if(r.status===404)throw new Error('هنوز چیزی از حساب‌گرا ویندوز ارسال نشده است.');
  if(!r.ok)throw new Error('سرور خطا داد ('+r.status+').');
  const box=await r.json();
  let plain;try{plain=await decryptEnvelope(box.data,password)}catch(e){throw new Error('رمز اشتباه است یا داده آسیب دیده است.')}
  const d=JSON.parse(plain);
  CL={code:code.trim()};try{localStorage.setItem(CK,JSON.stringify(CL))}catch(e){}
  accept(d);
}
function openCloud(){
  sheet(`<h1>دریافت از ابر</h1><p class="mut">کد اتصال را از حساب‌گرا ویندوز (تنظیمات ← همگام‌سازی ابری) بگیرید. رمز فقط روی همین گوشی برای باز کردن داده استفاده می‌شود و ذخیره نمی‌شود.</p>
  <input id="cc" type="search" placeholder="کد اتصال (HG1.…)" value="${esc(CL?CL.code:'')}" dir="ltr" autocomplete="off">
  <input id="cp" type="password" placeholder="رمز رمزگذاری" autocomplete="off" style="width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px">
  <p><button class="btn" id="cgo">دریافت و رمزگشایی</button></p><p id="cmsg" class="mut" role="status"></p>`);
  const go=$('#cgo');go.onclick=async()=>{
    const msg=$('#cmsg');msg.className='mut';msg.textContent='در حال دریافت...';go.disabled=true;
    try{await pullCloud($('#cc').value,$('#cp').value)}catch(e){msg.className='bad';msg.textContent=e.message||'خطا';go.disabled=false}
  };
}
render();
</script>
